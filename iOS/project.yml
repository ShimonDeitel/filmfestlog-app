name: Filmfestlog
options:
  bundleIdPrefix: com.shimondeitel.festlog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Filmfestlog:
    type: application
    platform: iOS
    sources:
      - path: Filmfestlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.festlog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Filmfestlog/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  FilmfestlogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FilmfestlogTests
      - path: Filmfestlog.storekit
    dependencies:
      - target: Filmfestlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.festlog.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  FilmfestlogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FilmfestlogUITests
    dependencies:
      - target: Filmfestlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.festlog.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Filmfestlog:
    build:
      targets:
        Filmfestlog: all
        FilmfestlogTests: [test]
        FilmfestlogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Filmfestlog.storekit
    test:
      config: Debug
      storeKitConfiguration: Filmfestlog.storekit
      targets:
        - FilmfestlogTests
        - FilmfestlogUITests
    archive:
      config: Release
